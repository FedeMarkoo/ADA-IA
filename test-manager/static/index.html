<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADA Test Manager</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.top{background:#15233b;color:white;padding:22px 32px}.top h1{margin:0;font-size:24px}.layout{display:grid;grid-template-columns:240px 320px 1fr;min-height:calc(100vh - 76px)}aside,section{padding:22px;border-right:1px solid #e1e6ef;background:white}h2{font-size:15px;margin-top:0;color:#68758a}.item{padding:12px;border-radius:9px;cursor:pointer;margin:5px 0}.item:hover,.selected{background:#eaf0ff;color:#244ed2}.card{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:18px;margin-bottom:16px}.muted{color:#77839a;font-size:13px}.prompt{white-space:pre-wrap;line-height:1.5}.button{border:0;border-radius:8px;background:#3159df;color:white;padding:10px 15px;cursor:pointer}.button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f5f7fb;padding:12px;border-radius:8px}.pass{color:#14804a}.fail{color:#c03636}.review{color:#a36500}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#101827;color:#dce5f5;padding:14px;border-radius:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside,section{border-right:0;border-bottom:1px solid #e1e6ef}}
</style></head><body><header class="top"><h1>ADA Test Manager</h1><span class="muted">Ejecuciones, tokens y evaluación IA</span></header><main class="layout"><aside><h2>CATEGORÍAS</h2><div id="categories"></div></aside><section><h2>PROMPTS</h2><div id="prompts" class="muted">Seleccioná una categoría.</div></section><section><div id="detail" class="muted">Seleccioná un prompt para ver sus ejecuciones.</div></section></main><script>
const $=id=>document.getElementById(id);let selected;
function node(tag, text, className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
async function get(url){return (await fetch(url)).json()}
function keyboardButton(el, handler){el.tabIndex=0;el.setAttribute('role','button');el.addEventListener('click',handler);el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();handler()}})}
async function loadCategories(){const xs=await get('/api/categories');const target=$('categories');target.replaceChildren();xs.forEach(x=>{const el=node('div',x.name,'item');keyboardButton(el,()=>loadPrompts(x.id,el));target.append(el)})}
async function loadPrompts(id,el){document.querySelectorAll('#categories .item').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const xs=await get('/api/categories/'+id);const target=$('prompts');target.replaceChildren();xs.forEach(x=>{const item=node('div',undefined,'item');const title=node('strong',x.name);const summary=node('div',x.prompt.slice(0,72)+'…','muted');item.append(title,summary);keyboardButton(item,()=>showPrompt(x));target.append(item)})}
function addText(parent,label,value){parent.append(node('span',label),node('b',value))}
async function showPrompt(x){selected=x;const runs=await get('/api/prompts/'+x.id+'/executions');const detail=$('detail');detail.replaceChildren();const card=node('div',undefined,'card');card.append(node('h2',x.name),node('div',x.prompt,'prompt'));card.append(node('p','Tools esperadas: '+(x.expected_tools.join(', ')||'ninguna')+' · Memorias: '+(x.expected_memories.join(', ')||'ninguna'),'muted'));const button=node('button','▶ Ejecutar / reejecutar','button');button.id='run';button.addEventListener('click',runPrompt);const status=node('p',undefined,'muted');status.id='runStatus';card.append(button,status);detail.append(card);const history=node('div');history.id='runs';runs.forEach(r=>history.append(renderRun(r)));if(!runs.length)history.append(node('p','Aún no hay ejecuciones.','muted'));detail.append(history)}
function renderRun(r){const e=r.evaluation||{};const card=node('div',undefined,'card');const verdict=node('b',(e.verdict||'sin evaluar').toUpperCase(),e.verdict||'');card.append(verdict,node('span',' · '+r.created_at));const metrics=node('div',undefined,'grid');[['Entrada',r.input_tokens??'—'],['Salida',r.output_tokens??'—'],['Modelo',r.model||'—']].forEach(([label,value])=>{const metric=node('div',undefined,'metric');addText(metric,label+'\n',value);metrics.append(metric)});card.append(metrics,node('h2','Tokens por componente'));const totals=node('div',undefined,'grid');(r.token_usage||[]).forEach(x=>{const metric=node('div',undefined,'metric');addText(metric,x.component+'\n',x.tokens+' tokens');totals.append(metric)});if(!totals.children.length)totals.append(node('span','Sin detalle','muted'));card.append(totals,node('h2','Respuesta'),node('pre',r.response||''),node('h2','Evaluación IA'),node('p',(e.score??'—')+'/10 · '+(e.rationale||'')),node('p',(e.findings||[]).join(' · '),'muted'));const details=node('details');details.append(node('summary','Contexto y diagnóstico'),node('pre',JSON.stringify({context_selection:r.context_selection,executed_tools:r.executed_tools,checks:e.checks},null,2)));card.append(details);return card}
async function runPrompt(){const b=$('run'),s=$('runStatus'),started=Date.now();b.disabled=true;b.textContent='Ejecutando y evaluando…';s.textContent='ADA está procesando el prompt. La evaluación IA puede tardar varios minutos.';const timer=setInterval(()=>s.textContent='En ejecución · '+Math.floor((Date.now()-started)/1000)+' s · no cierres esta pestaña',1000);try{await fetch('/api/prompts/'+selected.id+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await showPrompt(selected)}catch(e){s.className='fail';s.textContent='No se pudo conectar con el gestor: '+e.message}finally{clearInterval(timer);const current=$('run');if(current){current.disabled=false;current.textContent='▶ Ejecutar / reejecutar'}}}loadCategories();
</script></body></html>
