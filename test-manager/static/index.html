<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADA Test Manager</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.top{background:#15233b;color:white;padding:22px 32px}.top h1{margin:0;font-size:24px}.layout{display:grid;grid-template-columns:240px 320px 1fr;min-height:calc(100vh - 76px)}aside,section{padding:22px;border-right:1px solid #e1e6ef;background:white}h2{font-size:15px;margin-top:0;color:#68758a}.item{padding:12px;border-radius:9px;cursor:pointer;margin:5px 0}.item:hover,.selected{background:#eaf0ff;color:#244ed2}.card{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:18px;margin-bottom:16px}.muted{color:#77839a;font-size:13px}.prompt{white-space:pre-wrap;line-height:1.5}.button{border:0;border-radius:8px;background:#3159df;color:white;padding:10px 15px;cursor:pointer}.button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f5f7fb;padding:12px;border-radius:8px}.pass{color:#14804a}.fail{color:#c03636}.review{color:#a36500}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#101827;color:#dce5f5;padding:14px;border-radius:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside,section{border-right:0;border-bottom:1px solid #e1e6ef}}
</style></head><body><header class="top"><h1>ADA Test Manager</h1><span class="muted">Ejecuciones, tokens y evaluación IA</span></header><main class="layout"><aside><h2>CATEGORÍAS</h2><div id="categories"></div></aside><section><h2>PROMPTS</h2><div id="prompts" class="muted">Seleccioná una categoría.</div></section><section><div id="detail" class="muted">Seleccioná un prompt para ver sus ejecuciones.</div></section></main><script>
const $=id=>document.getElementById(id);let selected;
async function get(url){return (await fetch(url)).json()} async function loadCategories(){let xs=await get('/api/categories');$('categories').innerHTML=xs.map(x=>`<div class=item onclick="loadPrompts(${x.id},this)">${x.name}</div>`).join('')}
async function loadPrompts(id,el){document.querySelectorAll('#categories .item').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');let xs=await get('/api/categories/'+id);$('prompts').innerHTML=xs.map(x=>`<div class=item onclick='showPrompt(${JSON.stringify(x)})'><strong>${x.name}</strong><div class=muted>${x.prompt.slice(0,72)}…</div></div>`).join('')}
async function showPrompt(x){selected=x;let runs=await get('/api/prompts/'+x.id+'/executions');$('detail').innerHTML=`<div class=card><h2>${x.name}</h2><div class=prompt>${x.prompt}</div><p class=muted>Tools esperadas: ${x.expected_tools.join(', ')||'ninguna'} · Memorias: ${x.expected_memories.join(', ')||'ninguna'}</p><button class=button id=run onclick="runPrompt()">▶ Ejecutar / reejecutar</button><p id=runStatus class=muted></p></div><div id=runs>${runs.map(renderRun).join('')||'<p class=muted>Aún no hay ejecuciones.</p>'}</div>`}
function renderRun(r){let e=r.evaluation||{};let totals=(r.token_usage||[]).map(x=>`<div class=metric><b>${x.component}</b><br>${x.tokens} tokens</div>`).join('');return `<div class=card><b class=${e.verdict||''}>${(e.verdict||'sin evaluar').toUpperCase()}</b> · ${r.created_at}<div class=grid><div class=metric>Entrada<br><b>${r.input_tokens??'—'}</b></div><div class=metric>Salida<br><b>${r.output_tokens??'—'}</b></div><div class=metric>Modelo<br><b>${r.model||'—'}</b></div></div><h2>Tokens por componente</h2><div class=grid>${totals||'<span class=muted>Sin detalle</span>'}</div><h2>Respuesta</h2><pre>${r.response||''}</pre><h2>Evaluación IA</h2><p>${e.score??'—'}/10 · ${e.rationale||''}</p><p class=muted>${(e.findings||[]).join(' · ')}</p><details><summary>Contexto y diagnóstico</summary><pre>${JSON.stringify({context_selection:r.context_selection,executed_tools:r.executed_tools,checks:e.checks},null,2)}</pre></details></div>`}
async function runPrompt(){let b=$('run'),s=$('runStatus'),started=Date.now();b.disabled=true;b.textContent='Ejecutando y evaluando…';s.textContent='ADA está procesando el prompt. La evaluación IA puede tardar varios minutos.';let timer=setInterval(()=>s.textContent='En ejecución · '+Math.floor((Date.now()-started)/1000)+' s · no cierres esta pestaña',1000);try{let r=await fetch('/api/prompts/'+selected.id+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),x=await r.json();if(!r.ok){await showPrompt(selected);}else{await showPrompt(selected);}}catch(e){s.className='fail';s.textContent='No se pudo conectar con el gestor: '+e.message;}finally{clearInterval(timer);let current=$('run');if(current){current.disabled=false;current.textContent='▶ Ejecutar / reejecutar'}}}loadCategories();
</script></body></html>
