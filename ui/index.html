<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADA · Asistente</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf2ff;background:#080b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#25356a 0,#10162d 34%,#080b16 72%)}.shell{width:min(1080px,calc(100% - 32px));height:min(860px,calc(100vh - 32px));margin:16px auto;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid #ffffff18;border-radius:28px;background:#0d1222e8;box-shadow:0 24px 80px #0008;backdrop-filter:blur(18px)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:13px}.orb{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#8b7cff,#43d9c6);color:#101329;font-size:22px;font-weight:900;box-shadow:0 0 28px #6d70ff77}.title{font-size:18px;font-weight:750}.sub{margin-top:3px;color:#929bb8;font-size:12px}.status{display:flex;align-items:center;gap:8px;color:#aab4d0;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#42dfb5;box-shadow:0 0 12px #42dfb5}#messages{padding:28px;overflow:auto;scroll-behavior:smooth}.empty{text-align:center;color:#8993b3;margin-top:18vh}.empty h1{color:#eef1ff;font-size:28px;margin:0 0 8px}.empty p{margin:0;font-size:14px}.row{display:flex;margin:0 0 22px;animation:rise .22s ease-out}.row.user{justify-content:flex-end}.bubble{max-width:min(760px,88%);padding:14px 17px;border:1px solid #ffffff12;border-radius:18px 18px 18px 5px;background:#151c32;color:#e9edff;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{border-color:#6f72ff55;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,#4d4aa6,#3a438c)}.meta{margin-bottom:6px;color:#8e99b9;font-size:11px}.user .meta{text-align:right;color:#bec4ed}.model{display:inline-flex;gap:5px;margin-top:9px;padding:4px 8px;border-radius:8px;background:#ffffff0b;color:#9da8ca;font-size:10px}.model:before{content:"✦";color:#76e5cd}footer{padding:16px 22px 22px;border-top:1px solid #ffffff12;background:#0b1020aa}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px;color:#8993b3;font-size:12px}.toolbar>div{display:flex;gap:7px;align-items:center}.toolbar select{border:1px solid #ffffff18;border-radius:9px;padding:7px 10px;background:#151c32;color:#dce3ff;outline:none}.composer{display:flex;gap:10px;align-items:flex-end;padding:10px;border:1px solid #ffffff20;border-radius:17px;background:#11182b}.composer:focus-within{border-color:#777dff99;box-shadow:0 0 0 3px #777dff1f}.composer textarea{width:100%;min-height:50px;max-height:150px;resize:vertical;border:0;outline:0;background:transparent;color:#f1f4ff;font:inherit;line-height:1.45;padding:7px}.composer textarea::placeholder{color:#707b9d}.actions{display:flex;gap:7px}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;cursor:pointer}.send{background:linear-gradient(135deg,#8b7cff,#5fe0c6);color:#09101b;font-weight:800}.clear,.download{background:#ffffff0b;color:#aeb8d5}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.55;cursor:wait}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:640px){.shell{width:100%;height:100vh;margin:0;border-radius:0}.shell header{padding:18px}.status{display:none}#messages{padding:20px 15px}.bubble{max-width:94%}footer{padding:12px 12px 16px}.clear{display:none}.toolbar{align-items:flex-start}.toolbar>div{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="shell"><header><div class="brand"><div class="orb">A</div><div><div class="title">ADA</div><div class="sub">Agente local · chat y automatizaciones</div></div></div><div class="status"><span class="dot"></span><span>Lista para ayudarte</span></div></header><section id="messages"><div class="empty" id="empty"><h1>¿Qué hacemos hoy?</h1><p>Podés preguntarme algo, pedirme un análisis o enseñarme un procedimiento.</p></div></section><footer><div class="toolbar"><span>Enter para enviar · Shift + Enter para nueva línea</span><div><select id="lang" aria-label="Idioma"><option value="auto">Auto</option><option value="es">Español</option><option value="en">English</option></select><button class="btn download" id="download">Descargar .md</button></div></div><div class="composer"><textarea id="input" placeholder="Escribí tu mensaje…" aria-label="Mensaje"></textarea><div class="actions"><button class="btn clear" id="clear">Limpiar</button><button class="btn send" id="send">Enviar</button></div></div></footer></main>
  <style>
    .bubble h1,.bubble h2,.bubble h3{margin:0 0 10px;color:#f4f6ff}.bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3{font-size:1.08em}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.bubble ul,.bubble ol{margin:6px 0 10px;padding-left:24px}.bubble li{margin:3px 0}.bubble strong{color:#fff}.bubble code{padding:2px 5px;border-radius:5px;background:#080d1b;color:#b9f4e4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}.bubble pre{margin:10px 0;padding:12px;overflow:auto;border-radius:10px;background:#080d1b;color:#dce7ff}.bubble pre code{padding:0;background:none;color:inherit}.bubble blockquote{margin:10px 0;padding-left:12px;border-left:3px solid #777dff;color:#b9c3df}.bubble table{width:100%;margin:10px 0;border-collapse:collapse;font-size:.92em}.bubble th,.bubble td{padding:7px 9px;border:1px solid #ffffff20;text-align:left}.bubble th{background:#ffffff0d;color:#fff}.bubble hr{border:0;border-top:1px solid #ffffff20;margin:12px 0}
  </style>
  <script>
    const messages=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),clearBtn=document.getElementById('clear'),downloadBtn=document.getElementById('download'),langSel=document.getElementById('lang');
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function inlineMarkdown(value){let out=escapeHtml(value);out=out.replace(/`([^`]+)`/g,'<code>$1</code>');out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');out=out.replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>');out=out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return out}
    function markdownToHtml(markdown){const lines=String(markdown??'').replace(/\r\n?/g,'\n').split('\n');let html='',paragraph=[],list=null,inCode=false,code=[];
      const flushParagraph=()=>{if(paragraph.length){html+='<p>'+paragraph.map(inlineMarkdown).join('<br>')+'</p>';paragraph=[]}};
      const closeList=()=>{if(list){html+='</'+list+'>';list=null}};
      for(let i=0;i<lines.length;i++){const line=lines[i],trim=line.trim();
        if(trim.startsWith('```')){if(inCode){html+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';code=[];inCode=false}else{flushParagraph();closeList();inCode=true}continue}
        if(inCode){code.push(line);continue}
        const next=lines[i+1]?.trim()||'';
        if(trim.startsWith('|')&&/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(next)){flushParagraph();closeList();const headers=trim.replace(/^\||\|$/g,'').split('|').map(x=>inlineMarkdown(x.trim()));i+=2;const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(x=>inlineMarkdown(x.trim())));i++}i--;html+='<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue}
        let match=trim.match(/^(#{1,3})\s+(.+)/);if(match){flushParagraph();closeList();html+='<h'+match[1].length+'>'+inlineMarkdown(match[2])+'</h'+match[1].length+'>';continue}
        if(/^[-*_]{3,}$/.test(trim)){flushParagraph();closeList();html+='<hr>';continue}
        match=trim.match(/^[-*+]\s+(.+)/);if(match){flushParagraph();if(list!=='ul'){closeList();html+='<ul>';list='ul'}html+='<li>'+inlineMarkdown(match[1])+'</li>';continue}
        match=trim.match(/^\d+[.)]\s+(.+)/);if(match){flushParagraph();if(list!=='ol'){closeList();html+='<ol>';list='ol'}html+='<li>'+inlineMarkdown(match[1])+'</li>';continue}
        if(trim.startsWith('>')){flushParagraph();closeList();html+='<blockquote>'+inlineMarkdown(trim.replace(/^>\s?/,' '))+'</blockquote>';continue}
        if(!trim){flushParagraph();closeList();continue}paragraph.push(line)
      }if(inCode)html+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';flushParagraph();closeList();return html||'<p></p>'}
    function readableMessage(text){try{const value=JSON.parse(text);if(value.workflow!=='photo_review')return text;const t=value.technical||{},s=value.semantic||{},r=value.review||{},f=t.focus||{},e=t.exposure||{},c=t.composition||{},m=s.session_match||{};const score=v=>v===undefined?'—':v+'/10';const confidence=typeof m.confidence==='number'?(Math.round((m.confidence<=1?m.confidence*100:m.confidence))+'%'):(m.confidence||'—');let out='# Análisis fotográfico\n\n';out+='## Veredicto: '+(r.recommendation||'revisar')+' · '+score(t.overall_score)+'\n\n';out+='| Área | Puntuación | Lectura |\n|---|---:|---|\n';out+='| Enfoque | '+score(f.score)+' | '+(f.score<5?'Nitidez limitada; revisar foco o trepidación':'Nitidez aceptable')+' |\n';out+='| Exposición | '+score(e.score)+' | '+(e.score<5?'Subexpuesta o con sombras densas':'Equilibrada')+' |\n';out+='| Composición técnica | '+score(c.score)+' | Evaluación técnica |\n\n';if(s.subject)out+='## Lectura de la escena\n\n**Sujeto y contexto:** '+s.subject+'\n\n';if(s.style)out+='**Estilo:** '+s.style+'\n\n';if(s.photographer_feedback)out+='## Devolución como fotógrafo\n\n'+s.photographer_feedback+'\n\n';if(m.confidence)out+='**Coincidencia con la sesión:** '+confidence+'\n\n'+(m.reason||'')+'\n\n';if(r.strengths?.length)out+='**Puntos fuertes**\n\n'+r.strengths.map(x=>'- '+x).join('\n')+'\n\n';if(r.issues?.length)out+='**A revisar**\n\n'+r.issues.map(x=>'- '+x).join('\n')+'\n\n';return out.trim()}catch(err){return text}}
    function renderBody(element,text){const readable=readableMessage(String(text??''));element.dataset.markdown=readable;element.innerHTML=markdownToHtml(readable)}
    function add(role,text,model){document.getElementById('empty')?.remove();const row=document.createElement('div');row.className='row '+role;const bubble=document.createElement('div');bubble.className='bubble';const meta=document.createElement('div');meta.className='meta';meta.textContent=role==='user'?'Vos':'ADA';const body=document.createElement('div');renderBody(body,text);bubble.append(meta,body);if(model&&role!=='user'){const badge=document.createElement('div');badge.className='model';badge.textContent=model;bubble.append(badge)}row.append(bubble);messages.append(row);messages.scrollTop=messages.scrollHeight;return row}
    async function submit(){const text=input.value.trim();if(!text||send.disabled)return;add('user',text);input.value='';send.disabled=true;const actionLike=/\b(ejecut|corr|list|mostr|busc|mov|copi|cre|organiz|orden|agrup|renombr|borr|analiz)\w*/i.test(text);const waiting=add('bot',actionLike?'Ejecutando…':'Pensando…');try{const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,lang:langSel.value})});const data=await resp.json();renderBody(waiting.querySelector('.bubble div:nth-child(2)'),data.reply||data.error||'(sin respuesta)');if(data.model){const badge=document.createElement('div');badge.className='model';badge.textContent=data.model;waiting.querySelector('.bubble').append(badge)}await loadConversation()}catch(err){renderBody(waiting.querySelector('.bubble div:nth-child(2)'), 'No pude conectar con ADA: '+err.message)}finally{send.disabled=false;input.focus()}}
    function renderConversation(items){messages.innerHTML='';if(!items?.length){messages.innerHTML='<div class="empty" id="empty"><h1>¿Qué hacemos hoy?</h1><p>Podés preguntarme algo, pedirme un análisis o enseñarme un procedimiento.</p></div>';return}items.forEach(item=>add(item.role==='user'?'user':'bot',item.text,item.model))}
    async function loadConversation(){try{const resp=await fetch('/api/conversation',{cache:'no-store'});const data=await resp.json();renderConversation(data.messages||[])}catch(err){console.warn('No se pudo cargar el historial',err)}}
    async function clearConversation(){await fetch('/api/conversation',{method:'DELETE'});messages.innerHTML='<div class="empty" id="empty"><h1>¿Qué hacemos hoy?</h1><p>Podés preguntarme algo, pedirme un análisis o enseñarme un procedimiento.</p></div>'}
    function downloadMarkdown(){const rows=[...messages.querySelectorAll('.row')];let md='# Conversación con ADA\n\n';if(!rows.length)md+='_(Sin mensajes todavía.)_\n';rows.forEach(row=>{const role=row.classList.contains('user')?'Vos':'ADA';const body=row.querySelector('.bubble [data-markdown]')?.dataset.markdown||'';const model=row.querySelector('.model')?.textContent;md+=`## ${role}\n\n${body}\n`;if(model)md+=`\n**Modelo:** ${model}\n`;md+='\n'});const blob=new Blob([md],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ada-conversacion-${new Date().toISOString().slice(0,10)}.md`;a.click();URL.revokeObjectURL(url)}
    send.onclick=submit;downloadBtn.onclick=downloadMarkdown;clearBtn.onclick=clearConversation;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});loadConversation();input.focus();
  </script>
</body>
</html>
