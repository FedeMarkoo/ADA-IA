name: Publish MCP image

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-publish.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fedemarkoo/ada-mcps

jobs:
  publish:
    name: Build and publish MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
