name: Notify Docker image updates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-update-notification
  cancel-in-progress: true

jobs:
  check-image:
    name: Check ADA image digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/fedemarkoo/ada-ia:latest
    steps:
      - name: Inspect published image
        id: image
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE" | awk '/^  Digest:/ { print $2; exit }')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore previous digest
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .docker-image-state
          key: docker-image-digest-${{ steps.image.outputs.digest }}
          restore-keys: docker-image-digest-

      - name: Determine whether the image changed
        id: change
        run: |
          set -euo pipefail
          current='${{ steps.image.outputs.digest }}'
          previous=''
          if [ -f .docker-image-state/digest ]; then
            previous="$(cat .docker-image-state/digest)"
          fi
          if [ -z "$previous" ]; then
            echo "kind=baseline" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$previous" ]; then
            echo "kind=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "kind=updated" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p .docker-image-state
          printf '%s\n' "$current" > .docker-image-state/digest

      - name: Send Telegram notification
        if: steps.change.outputs.kind == 'updated'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          message="Nueva imagen Docker disponible: ${IMAGE}\nDigest: ${IMAGE_DIGEST}\n\nActualizar con: docker compose pull ada && docker compose up -d ada"
          curl --fail --silent --show-error --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Save current digest
        if: always() && steps.image.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .docker-image-state
          key: docker-image-digest-${{ steps.image.outputs.digest }}
