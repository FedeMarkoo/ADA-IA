name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Maven project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install vendored observability library
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f libs/ada-observability/pom.xml install
      - name: Validate
        run: mvn --batch-mode --no-transfer-progress validate

  mcp:
    name: Test MCP servers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test MCP image sources
        run: |
          python3 -m unittest discover -s mcp -p 'test_gateway.py'
          python3 -m unittest discover -s mcp/filesystem -p 'test_*.py'
          python3 -m unittest discover -s mcp/web-search -p 'test_*.py'
      - name: Test SQLite smoke runner
        run: python3 -m unittest discover -s scripts/testing -p 'test_*.py'

  test:
    name: Run tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install vendored observability library
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f libs/ada-observability/pom.xml install
      - name: Test
        run: mvn --batch-mode --no-transfer-progress test

  quality:
    name: Quality (${{ matrix.check }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [format, compile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install vendored observability library
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f libs/ada-observability/pom.xml install
      - name: Check formatting
        if: matrix.check == 'format'
        run: mvn --batch-mode --no-transfer-progress spotless:check
      - name: Compile
        if: matrix.check == 'compile'
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

  package:
    name: Package application
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install vendored observability library
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f libs/ada-observability/pom.xml install
      - name: Package
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  coverage:
    name: Generate coverage report
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install vendored observability library
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f libs/ada-observability/pom.xml install
      - name: Test with coverage
        run: mvn --batch-mode --no-transfer-progress test jacoco:report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
