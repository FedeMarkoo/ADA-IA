name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check code formatting (Black)
        run: black --check ada mcps telegram utils tests

      - name: Check code style (Ruff)
        run: ruff check ada mcps telegram utils tests

  type-check:
    name: Static Type Analysis (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run mypy type checker
        run: mypy ada mcps telegram utils --ignore-missing-imports --explicit-package-bases

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  evaluation-tests:
    name: AI Evaluation & Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run evaluation harness
        run: python -m unittest tests.test_evaluation -v

  build-and-package:
    name: Package Build & CLI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel installation & CLI entrypoint
        run: |
          pip install dist/*.whl
          ada --help

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no unencrypted secrets or personal configs are tracked in Git
        run: |
          echo "Checking tracked files for sensitive patterns..."
          if git ls-files | grep -E '(^|/)(\.env|config\.json|ada/config\.json|.*\.pem|.*\.key)$' | grep -v -E '(config\.example\.json|mcps/config\.json)'; then
            echo "ERROR: Sensitive file tracked in repository!"
            exit 1
          fi
          echo "Security scan passed: no sensitive files tracked."

