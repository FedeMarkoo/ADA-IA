name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests
      - run: mypy src/ada/domain src/ada/application/planner.py src/ada/application/services src/ada/application/evaluation.py src/ada/infrastructure/providers.py --ignore-missing-imports --explicit-package-bases
