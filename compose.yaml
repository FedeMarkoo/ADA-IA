services:
  ada-data-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command: ["/bin/sh", "-c", "mkdir -p /ada-data/db /ada-data/logs /ada-data/backups /ada-data/exports /ada-data/models /ada-data/runtime /test-manager-data && chown -R $${ADA_CONTAINER_UID:-10001}:$${ADA_CONTAINER_GID:-10001} /ada-data/db /ada-data/logs /ada-data/exports /ada-data/models /ada-data/runtime /test-manager-data"]
    volumes:
      - ${ADA_DATA_DIR:-../ada-data}:/ada-data
      - ${ADA_TEST_MANAGER_DATA_DIR:-../ada-test-manager-data}:/test-manager-data

  ada:
    image: ${ADA_IMAGE:-ghcr.io/fedemarkoo/ada-ia}:${ADA_VERSION:-latest}
    user: "${ADA_CONTAINER_UID:-10001}:${ADA_CONTAINER_GID:-10001}"
    restart: unless-stopped
    environment:
      ADA_DATA_DIR: /data
      ADA_LLM_BASE_URL: ${ADA_LLM_BASE_URL:-http://litellm:4000}
      ADA_LLM_API_KEY: ${ADA_LLM_API_KEY:-${LITELLM_MASTER_KEY:-}}
      ADA_LLM_DEFAULT_MODEL: ${ADA_LLM_DEFAULT_MODEL:-openai/gpt-4o-mini}
      ADA_LLM_ROUTING_MODEL: ${ADA_LLM_ROUTING_MODEL:-ollama/llama3.2:1b}
      ADA_TELEGRAM_ENABLED: ${ADA_TELEGRAM_ENABLED:-false}
      ADA_TELEGRAM_BOOTSTRAP_BOT_TOKEN: ${ADA_TELEGRAM_BOOTSTRAP_BOT_TOKEN:-}
      ADA_TELEGRAM_BOOTSTRAP_CHAT_ID: ${ADA_TELEGRAM_BOOTSTRAP_CHAT_ID:-}
      ADA_SECRET_MASTER_KEY: ${ADA_SECRET_MASTER_KEY:-}
      ADA_DEPLOYED_VERSION: ${ADA_VERSION:-latest}
      ADA_MCP_WEB_SEARCH_URL: http://ada-mcps:8000/web-search
      ADA_MCP_FILESYSTEM_URL: http://ada-mcps:8000/filesystem
      ADA_AUTONOMY_WEATHER_ENABLED: ${ADA_AUTONOMY_WEATHER_ENABLED:-false}
      ADA_AUTONOMY_WEATHER_TIMEZONE: ${ADA_AUTONOMY_WEATHER_TIMEZONE:-America/Argentina/Buenos_Aires}
      ADA_AUTONOMY_WEATHER_CRON: ${ADA_AUTONOMY_WEATHER_CRON:-0 0 8 * * *}
      ADA_AUTONOMY_WEATHER_LOCATION: ${ADA_AUTONOMY_WEATHER_LOCATION:-}
      ADA_AUTONOMY_WEATHER_CONVERSATION_ID: ${ADA_AUTONOMY_WEATHER_CONVERSATION_ID:-autonomy-weather}
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ${ADA_DATA_DIR:-../ada-data}:/data
    depends_on:
      ada-data-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      ada-mcps:
        condition: service_healthy

  ada-test-manager:
    build: ./test-manager
    restart: unless-stopped
    environment:
      ADA_URL: http://ada:8080
      DB_PATH: /data/test-manager.sqlite
      ADA_TIMEOUT_SECONDS: ${ADA_TIMEOUT_SECONDS:-900}
      ADA_POLL_SECONDS: ${ADA_POLL_SECONDS:-2}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ${ADA_TEST_MANAGER_DATA_DIR:-../ada-test-manager-data}:/data
    depends_on:
      ada-data-init:
        condition: service_completed_successfully
      ada:
        condition: service_started

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ${LITELLM_CONFIG:-./deploy/litellm/config.yaml}:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${OLLAMA_DATA_DIR:-ollama-data}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:0.33.1
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_ROUTING_MODEL:-llama3.2:1b} && ollama pull $${OLLAMA_MODEL:-qwen2.5:7b}"]

  ada-mcps:
    build: ./mcp
    restart: unless-stopped
    environment:
      ADA_FILESYSTEM_ALLOWED_ROOTS: /data:/gdrive
    volumes:
      - ${ADA_DATA_DIR:-../ada-data}:/data:ro
      - ${ADA_GDRIVE_PATH:?ADA_GDRIVE_PATH must point to the host Google Drive mount}:/gdrive:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/filesystem', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      ada-data-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  ollama-data:
