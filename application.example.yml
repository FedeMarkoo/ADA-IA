ada:
  data-dir: ${ADA_DATA_DIR:../ada-data}
  llm:
    base-url: ${ADA_LLM_BASE_URL:http://127.0.0.1:4000}
    api-key: ${ADA_LLM_API_KEY:}
    default-model: ${ADA_LLM_DEFAULT_MODEL:openai/gpt-4o-mini}

spring:
  datasource:
    url: jdbc:sqlite:${ada.data-dir}/db/ada.sqlite
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
