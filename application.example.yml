ada:
  data-dir: ${ADA_DATA_DIR:../ada-data}
  llm:
    base-url: ${ADA_LLM_BASE_URL:http://127.0.0.1:4000}
    api-key: ${ADA_LLM_API_KEY:}
    default-model: ${ADA_LLM_DEFAULT_MODEL:openai/gpt-4o-mini}
  discord:
    enabled: ${ADA_DISCORD_ENABLED:false}
    bootstrap-bot-token: ${ADA_DISCORD_BOOTSTRAP_BOT_TOKEN:}
    bootstrap-channel-id: ${ADA_DISCORD_BOOTSTRAP_CHANNEL_ID:}

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
