[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-local"
version = "0.1.0"
description = "Local multi-agent assistant"
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3,<4",
    "numpy>=1.24,<3",
    "Pillow>=9,<12",
    "rawpy>=0.25,<0.28",
    "psutil>=5.9,<8",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
vision = ["sentence-transformers>=2.2,<6", "torch>=2,<3"]
gpt4all = ["gpt4all>=2.8,<3"]
web-search = ["ddgs>=9,<10"]
remote-llm = ["openai>=1,<3", "anthropic>=0.30,<1"]
gmail = ["google-api-python-client>=2,<3", "google-auth>=2,<3", "google-auth-oauthlib>=1,<3"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
credentials = ["cryptography>=42,<46"]
voice = ["faster-whisper>=1,<2"]
desktop = ["plyer>=2,<3"]
fine-tuning = ["datasets>=2,<4", "transformers>=4.40,<5", "peft>=0.10,<1", "accelerate>=0.28,<2"]
dev = [
    "black>=24",
    "mypy>=1.10,<2",
    "pre-commit>=3,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
ada = "ada.interfaces.cli:main"
ada-autonomous = "ada.infrastructure.runtime.daemon:run"
ada-supervisor = "ada.infrastructure.runtime.supervisor:run"
ada-mcp = "ada.interfaces.mcp_server:main"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "logs"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '/(\\.venv|logs)/'

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["ada*", "mcps*", "telegram*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
