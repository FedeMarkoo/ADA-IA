[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-local"
version = "0.1.0"
description = "Local multi-agent assistant"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.3,<4",
    "numpy>=1.24,<3",
    "Pillow>=9,<12",
    "rawpy>=0.27,<0.28",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
vision = ["sentence-transformers>=2.2,<6", "torch>=2,<3"]
gpt4all = ["gpt4all>=2.8,<3"]
web-search = ["ddgs>=9,<10"]
remote-llm = ["openai>=1,<3", "anthropic>=0.30,<1"]
gmail = ["google-api-python-client>=2,<3", "google-auth>=2,<3"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
credentials = ["cryptography>=42,<46"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]
