[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-local"
version = "0.1.0"
description = "Local multi-agent assistant"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.3,<4",
    "numpy>=1.24,<3",
    "Pillow>=9,<12",
    "rawpy>=0.27,<0.28",
]

[project.optional-dependencies]
vision = ["sentence-transformers>=2.2,<6", "torch>=2,<3"]
gpt4all = ["gpt4all>=2.8,<3"]
web-search = ["ddgs>=9,<10"]
remote-llm = ["openai>=1,<3", "anthropic>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
