spring:
  application:
    name: ada
  config:
    import: optional:file:./application-local.yml
  jackson:
    default-property-inclusion: non_null
  sql:
    init:
      mode: always

ada:
  data-dir: ${ADA_DATA_DIR:../ada-data}
  llm:
    base-url: ${ADA_LLM_BASE_URL:http://127.0.0.1:4000}
    api-key: ${ADA_LLM_API_KEY:}
    default-model: ${ADA_LLM_DEFAULT_MODEL:openai/gpt-4o-mini}
  mcp:
    web-search-url: ${ADA_MCP_WEB_SEARCH_URL:http://127.0.0.1:8000/mcp}

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
