spring:
  application:
    name: ada
  config:
    import: optional:file:./application-local.yml
  jackson:
    default-property-inclusion: non_null
  sql:
    init:
      mode: always

# Persist logs alongside the SQLite database, under ADA_DATA_DIR.
logging:
  file:
    name: ${ADA_DATA_DIR:../ada-data}/logs/ada.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: false

ada:
  data-dir: ${ADA_DATA_DIR:../ada-data}
  observability:
    application-name: ${spring.application.name:ada}
  llm:
    base-url: ${ADA_LLM_BASE_URL:http://127.0.0.1:4000}
    api-key: ${ADA_LLM_API_KEY:}
    default-model: ${ADA_LLM_DEFAULT_MODEL:ollama/qwen2.5:7b}
    routing-model: ${ADA_LLM_ROUTING_MODEL:ollama/llama3.2:1b}
    prompt-optimization:
      enabled: ${ADA_LLM_PROMPT_OPTIMIZATION_ENABLED:true}
      min-chars: ${ADA_LLM_PROMPT_OPTIMIZATION_MIN_CHARS:120}
  mcp:
    web-search-url: ${ADA_MCP_WEB_SEARCH_URL:http://127.0.0.1:8000/web-search}
    filesystem-url: ${ADA_MCP_FILESYSTEM_URL:http://127.0.0.1:8000/filesystem}
  telegram:
    enabled: ${ADA_TELEGRAM_ENABLED:false}
    bootstrap-bot-token: ${ADA_TELEGRAM_BOOTSTRAP_BOT_TOKEN:}
    bootstrap-chat-id: ${ADA_TELEGRAM_BOOTSTRAP_CHAT_ID:}
  discord:
    enabled: ${ADA_DISCORD_ENABLED:false}
    bootstrap-bot-token: ${ADA_DISCORD_BOOTSTRAP_BOT_TOKEN:}
    bootstrap-channel-id: ${ADA_DISCORD_BOOTSTRAP_CHANNEL_ID:}
    send-lifecycle-notifications: ${ADA_DISCORD_SEND_LIFECYCLE_NOTIFICATIONS:true}
  secrets:
    master-key: ${ADA_SECRET_MASTER_KEY:}
  rag:
    enabled: ${ADA_RAG_ENABLED:true}
    top-k: ${ADA_RAG_TOP_K:5}
    max-context-characters: ${ADA_RAG_MAX_CONTEXT_CHARACTERS:6000}

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
